[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-v45-ecg-multihead"
version = "0.1.0"
description = "Research implementation and reproducibility package for TITAN V4.5 multihead ECG models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Mateo Gavilanes"}]
keywords = ["ecg", "deep-learning", "arrhythmia", "pathology", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
data = [
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "wfdb>=4.1,<5",
  "zstandard>=0.23,<1",
]
optuna = ["optuna>=3.6,<5"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.urls]
Repository = "https://github.com/Mateo197802/titan-v45-ecg-multihead"
Issues = "https://github.com/Mateo197802/titan-v45-ecg-multihead/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
