name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/titan-external-validation-20261111, codex/titan-duration-aware-adaptation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Release hash declarations (missing physical assets reported explicitly)
        run: python scripts/evaluation/verify_release_hashes.py
      - name: Verify public adaptation receipts
        run: python scripts/domain_adaptation/verify_adaptation_delivery.py docs/domain_adaptation/evidence
      - name: Verify integrated public scientific evidence
        run: python scripts/evaluation/verify_integrated_public_evidence.py
      - name: Verify public performance recovery evidence when present
        run: |
          if [ -d docs/performance_recovery/evidence ]; then
            python scripts/domain_adaptation/verify_recovery_delivery.py docs/performance_recovery/evidence
          fi
      - name: Tests
        run: python -m pytest -q
      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Render aggregate adaptation figures outside the checkout
        if: matrix.python-version == '3.12'
        run: python scripts/domain_adaptation/plot_adaptation.py docs/domain_adaptation/evidence "$RUNNER_TEMP/titan-adaptation-figures"
      - name: Upload aggregate adaptation figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: titan-adaptation-figures
          path: ${{ runner.temp }}/titan-adaptation-figures/*.png
          if-no-files-found: error
